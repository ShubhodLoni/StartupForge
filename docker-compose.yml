services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: startupforge
      POSTGRES_PASSWORD: startupforge
      POSTGRES_DB: startupforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startupforge -d startupforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://startupforge:startupforge@db:5432/startupforge
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
